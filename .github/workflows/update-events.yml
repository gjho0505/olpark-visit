name: update-events
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/update_events.py
      - run: |
          git config user.name "events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.js
          git diff --cached --quiet || git commit -m "공연 일정 자동 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
